# Testa e gera o Faro.app para macOS (Intel e Apple Silicon).
#
# - Em todo push no main e em pull requests: testes + Faro.zip como artefato.
# - Em tags v* (ex.: v0.2.0): também publica o Faro.zip como Release.
# - Dá para rodar à mão em Actions > Build > Run workflow.
#
# O Faro.zip traz só o Faro.app. O serviço (daemon) vai dentro
# do app e é instalado pelo botão "Instalar" da tela Início, com a senha do Mac.
# O app tem assinatura ad-hoc (sem Developer ID da Apple): na primeira abertura
# o macOS pede "Abrir Mesmo Assim" em Ajustes > Privacidade e Segurança.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust (testes)
        run: cargo test --workspace
      - name: Rust (clippy sem avisos)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Frontend (testes e build)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  pacote:
    needs: testes
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Daemon (universal), para ir dentro do app
        run: |
          cargo build --release -p vigia-daemon --target aarch64-apple-darwin
          cargo build --release -p vigia-daemon --target x86_64-apple-darwin
          lipo -create -output app/src-tauri/resources/faro-daemon \
            target/aarch64-apple-darwin/release/vigia-daemon \
            target/x86_64-apple-darwin/release/vigia-daemon
          lipo -info app/src-tauri/resources/faro-daemon
          # Assinatura ad-hoc com identificador fixo: o Acesso Total ao Disco
          # fica preso a ela (sem assinatura nenhuma, o macOS pode não aceitar).
          codesign --force --sign - --identifier dev.natan.faro.daemon app/src-tauri/resources/faro-daemon
          codesign --verify --strict app/src-tauri/resources/faro-daemon
      - name: App (Faro.app universal, com o daemon dentro)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --target universal-apple-darwin --bundles app
      - name: Assinatura ad-hoc e Faro.zip
        run: |
          APP=target/universal-apple-darwin/release/bundle/macos/Faro.app
          test -x "$APP/Contents/Resources/resources/faro-daemon"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          # ditto preserva o bundle (links simbólicos, permissões, assinatura).
          ditto -c -k --keepParent "$APP" Faro.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Faro
          path: Faro.zip
          retention-days: 30
      - name: Release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Faro.zip --title "Faro ${GITHUB_REF_NAME}" --notes "$(cat <<'EOF'
          ## Instalar

          1. Baixe o **Faro.zip** abaixo e abra: aparece o **Faro.app**.
          2. Arraste o Faro.app para **Aplicativos** e abra.
          3. Na primeira vez, o macOS avisa que não pode verificar o app (ele ainda não tem assinatura da Apple). Vá em **Ajustes do Sistema > Privacidade e Segurança** e clique em **Abrir Mesmo Assim**.
          4. Na tela **Início**, clique em **Instalar** (pede a senha do Mac) e depois dê o **Acesso Total ao Disco** ao serviço.

          Requisitos: macOS 13 ou mais novo, Intel ou Apple Silicon.
          EOF
          )"
