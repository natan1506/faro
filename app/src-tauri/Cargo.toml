[package]
name = "vigia-app"
description = "App do Vigia: alertas no topo da tela e painel de histórico"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "vigia_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vigia-proto = { path = "../../crates/proto" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt", "process"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
